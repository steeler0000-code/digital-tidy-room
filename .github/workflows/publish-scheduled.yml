name: Validate Caelus content manually

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: caelus-manual-validation
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate the site
        run: SITE_URL=https://caelus-h.com npm run build
