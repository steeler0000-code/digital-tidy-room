name: Publish scheduled content

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish approved due content
        run: node scripts/publish-scheduled.mjs

      - name: Validate the site
        run: SITE_URL=https://caelus-h.com npm run build

      - name: Commit published content
        run: |
          if git diff --quiet; then
            echo "No content is due."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content
          git commit -m "Publish scheduled content"
          git push
